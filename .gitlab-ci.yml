stages:
  - test
  - smoke
  - build-apk
  - apk-e2e

# Anchored image spec — disable the docker image's own ENTRYPOINT
# (/entrypoint.sh boots the emulator and would fail in a non-KVM container).
.apk_image: &apk_image
  name: inkstone-apk-e2e:dev-cached
  entrypoint: [""]

# Headless browser / scheduler / ordering tests on shared runners (fast, no KVM).
test:
  stage: test
  image: node:22
  before_script:
    - apt-get update -qq && apt-get install -y -qq chromium > /dev/null 2>&1
    - npm ci --ignore-scripts
    - cd rust/anki-scheduler && mkdir -p pkg-node
    # Use pre-built WASM — Rust toolchain not available in CI
    - cp pkg/anki_scheduler_bg.wasm pkg-node/ 2>/dev/null || true
    - cp pkg/*.js pkg-node/ 2>/dev/null || true
    - cd ../..
  script:
    - node scripts/test-wasm-scheduler.cjs
    - node scripts/test-unit-session.cjs
    - node scripts/test-unit-ordering.cjs
    - node scripts/test-ordering-e2e.cjs
    - node scripts/test-browser-e2e.cjs
  artifacts:
    paths:
      - /tmp/*.png
    when: always
    expire_in: 1 day

# Smoke test for the self-hosted runner: confirms the job runs inside a
# docker container with host paths invisible. The runner box itself owns
# the Android emulator + adb daemon; the container only talks adb over
# the docker bridge.
hello-android-kvm:
  stage: smoke
  tags:
    - android-kvm
  image: *apk_image
  script:
    - |
      set -e
      echo "=== Inside the CI job (docker container) ==="
      echo "hostname: $(hostname)"
      echo "machine-id: $(cat /etc/machine-id 2>/dev/null || echo none)"
      echo
      echo "=== Isolation assertions — host paths must NOT be visible ==="
      if [ "$(hostname)" = "d-claude" ]; then echo "FAIL hostname is host"; exit 1; fi
      echo "OK hostname not host"
      HOST_MID=80790cf6e8824056b36627e24a6822a3
      if [ "$(cat /etc/machine-id 2>/dev/null)" = "$HOST_MID" ]; then echo "FAIL machine-id matches host"; exit 1; fi
      echo "OK machine-id not host"
      if [ -d /srv/work ]; then echo "FAIL /srv/work leaked"; exit 1; fi
      echo "OK /srv/work not visible"
      if [ -e /etc/gitlab-runner ]; then echo "FAIL gitlab-runner config leaked"; exit 1; fi
      echo "OK /etc/gitlab-runner not visible"
      if [ -e /var/lib/docker ]; then echo "FAIL host docker dir leaked"; exit 1; fi
      echo "OK /var/lib/docker not visible"
      echo "SMOKE OK"

# Build the debug APK so apk-e2e can install commit-specific code.
build-apk:
  stage: build-apk
  tags:
    - android-kvm
  image: *apk_image
  script:
    - ln -sfn /srv/baked/node_modules node_modules
    - bash scripts/stamp-version.sh
    - npx cap sync android
    - cd android && ./gradlew --no-daemon assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 day

# Real APK end-to-end suite on the host's emulator. See
# docker/apk-e2e/README.md for the runner-host emulator architecture.
#
# This single job runs three test scripts back-to-back, sharing one
# APK install and one socat bridge. Between scripts we reset emulator
# state via `pm clear` + relaunch + re-discovery of the WebView socket
# (the WebView's abstract socket name changes after pm clear because
# the renderer pid changes). The socat bridge survives — it points at
# the adb server on the host, which redirects tcp:9222 to whichever
# abstract socket adb forward currently maps.
#
# Sub-scripts:
#  - test-apk-e2e.cjs        — single-card session, 一 then 十.
#  - test-apk-multicard.cjs  — multi-card 一/十/三 (preempt path).
#  - test-apk-midstroke-flush.cjs — getNextCard reactivity regression
#    smoke; flaky enough that the original job used allow_failure:true.
#    We run it last with `|| true` and surface a tally; the job still
#    passes if the first two scripts pass and midstroke fails — this
#    preserves the old per-job `allow_failure` semantics at script
#    granularity.
apk-tests:
  stage: apk-e2e
  needs:
    - job: build-apk
      artifacts: true
  tags:
    - android-kvm
  image: *apk_image
  variables:
    ANDROID_ADB_SERVER_ADDRESS: adb-host   # extra_hosts maps to host gateway
    ANDROID_ADB_SERVER_PORT: "5037"
    CDP_HOST: adb-host
    CDP_PORT: "9222"
    PKG: me.skishore.inkstone
    APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
    ARTIFACTS_DIR: artifacts
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - ln -sfn /srv/baked/node_modules node_modules
    - adb devices
    - adb uninstall "$PKG" 2>&1 | tail -1 || true
    - adb install -r "$APK_PATH"
    - adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS 2>&1 || true
    - adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > /dev/null
    - sleep 8
    - |
      WS=$(adb shell cat /proc/net/unix | awk '/webview_devtools_remote/{print $NF; exit}' | tr -d '\r')
      echo "WebView socket: $WS"
      adb forward tcp:9222 "localabstract:${WS#@}"
      curl -fs -H "Host: localhost" "http://$CDP_HOST:$CDP_PORT/json" > /dev/null && echo "CDP reachable via host"
      # Chrome DevTools rejects non-localhost Host headers. Bridge the
      # host-forwarded port to 127.0.0.1 inside the container so the test
      # can speak http+ws with Host: localhost.
      socat TCP-LISTEN:9222,bind=127.0.0.1,fork,reuseaddr TCP:"$CDP_HOST":"$CDP_PORT" &
      sleep 1
      curl -fs "http://localhost:9222/json" > /dev/null && echo "CDP reachable via local socat"
  script:
    # One shell block — bash functions don't survive across GitLab
    # `script:` list entries (each is its own shell invocation). The
    # midstroke run is wrapped in an `if` so its non-zero exit does
    # not trip `set -e`; this preserves the old `allow_failure: true`
    # semantics at sub-script granularity.
    - |
      set -e
      reset_app() {
        echo "=== reset emulator state ==="
        # `pm clear` proved unreliable — after it, monkey's relaunch
        # left only WebViewZygoteInit in /proc/net/unix and the
        # real webview_devtools_remote_* socket never appeared. Fall
        # back to the same uninstall/install flow that the per-job
        # before_script used to do; ~10 s slower per reset than `pm
        # clear` but actually works.
        adb uninstall "$PKG" 2>&1 | tail -1 || true
        adb install -r "$APK_PATH"
        adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS 2>&1 || true
        adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > /dev/null
        # Poll up to ~30 s for the new WebView devtools abstract socket to
        # show up in /proc/net/unix. After `pm clear` the renderer pid (and
        # therefore the socket name) changes, so we can't reuse the old one.
        NEW_WS=""
        for i in $(seq 1 30); do
          NEW_WS=$(adb shell cat /proc/net/unix | awk '/webview_devtools_remote/{print $NF; exit}' | tr -d '\r')
          if [ -n "$NEW_WS" ]; then
            echo "WebView socket (post-reset, after ${i}s): $NEW_WS"
            break
          fi
          sleep 1
        done
        if [ -z "$NEW_WS" ]; then
          echo "ERROR: WebView devtools socket did not appear within 30 s after pm clear" >&2
          adb shell cat /proc/net/unix >&2 || true
          exit 1
        fi
        adb forward --remove-all
        adb forward tcp:9222 "localabstract:${NEW_WS#@}"
        # Poll up to ~15 s for the CDP /json endpoint to start responding
        # through the existing socat bridge. The bridge itself is left
        # running from before_script — only `adb forward` rebinds here.
        CDP_OK=""
        for i in $(seq 1 30); do
          if curl -fs "http://localhost:9222/json" > /dev/null 2>&1; then
            echo "CDP reachable via local socat (after $((i*5))00ms)"
            CDP_OK=1
            break
          fi
          sleep 0.5
        done
        if [ -z "$CDP_OK" ]; then
          echo "ERROR: CDP /json did not respond within 15 s after adb forward" >&2
          curl -v "http://localhost:9222/json" >&2 || true
          exit 1
        fi
      }
      echo "--- apk-e2e ---"
      node scripts/test-apk-e2e.cjs
      reset_app
      echo "--- apk-multicard ---"
      node scripts/test-apk-multicard.cjs
      reset_app
      echo "--- apk-midstroke-flush (allow_failure) ---"
      if node scripts/test-apk-midstroke-flush.cjs; then
        echo "MIDSTROKE_RESULT=pass"
      else
        echo "MIDSTROKE_RESULT=fail (allowed; matches old allow_failure:true)"
      fi
  artifacts:
    paths:
      - artifacts/
    when: always
    expire_in: 7 days
