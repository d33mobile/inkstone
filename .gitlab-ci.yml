stages:
  - test
  - smoke
  - build-apk
  - apk-e2e

# Anchored image spec — disable the docker image's own ENTRYPOINT
# (/entrypoint.sh boots the emulator and would fail in a non-KVM container).
.apk_image: &apk_image
  name: inkstone-apk-e2e:dev
  entrypoint: [""]

# Headless browser / scheduler / ordering tests on shared runners (fast, no KVM).
test:
  stage: test
  image: node:22
  before_script:
    - apt-get update -qq && apt-get install -y -qq chromium > /dev/null 2>&1
    - npm ci --ignore-scripts
    - cd rust/anki-scheduler && mkdir -p pkg-node
    # Use pre-built WASM — Rust toolchain not available in CI
    - cp pkg/anki_scheduler_bg.wasm pkg-node/ 2>/dev/null || true
    - cp pkg/*.js pkg-node/ 2>/dev/null || true
    - cd ../..
  script:
    - node scripts/test-wasm-scheduler.cjs
    - node scripts/test-unit-session.cjs
    - node scripts/test-unit-ordering.cjs
    - node scripts/test-ordering-e2e.cjs
    - node scripts/test-browser-e2e.cjs
  artifacts:
    paths:
      - /tmp/*.png
    when: always
    expire_in: 1 day

# Smoke test for the self-hosted runner: confirms the job runs inside a
# docker container with host paths invisible. The runner box itself owns
# the Android emulator + adb daemon; the container only talks adb over
# the docker bridge.
hello-android-kvm:
  stage: smoke
  tags:
    - android-kvm
  image: *apk_image
  script:
    - |
      set -e
      echo "=== Inside the CI job (docker container) ==="
      echo "hostname: $(hostname)"
      echo "machine-id: $(cat /etc/machine-id 2>/dev/null || echo none)"
      echo
      echo "=== Isolation assertions — host paths must NOT be visible ==="
      if [ "$(hostname)" = "d-claude" ]; then echo "FAIL hostname is host"; exit 1; fi
      echo "OK hostname not host"
      HOST_MID=80790cf6e8824056b36627e24a6822a3
      if [ "$(cat /etc/machine-id 2>/dev/null)" = "$HOST_MID" ]; then echo "FAIL machine-id matches host"; exit 1; fi
      echo "OK machine-id not host"
      if [ -d /srv/work ]; then echo "FAIL /srv/work leaked"; exit 1; fi
      echo "OK /srv/work not visible"
      if [ -e /etc/gitlab-runner ]; then echo "FAIL gitlab-runner config leaked"; exit 1; fi
      echo "OK /etc/gitlab-runner not visible"
      if [ -e /var/lib/docker ]; then echo "FAIL host docker dir leaked"; exit 1; fi
      echo "OK /var/lib/docker not visible"
      echo "SMOKE OK"

# Build the debug APK so apk-e2e can install commit-specific code.
build-apk:
  stage: build-apk
  tags:
    - android-kvm
  image: *apk_image
  script:
    - npm ci --ignore-scripts
    - bash scripts/stamp-version.sh
    - npx cap sync android
    - cd android && ./gradlew --no-daemon assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 day

# Real APK end-to-end test on the host's emulator. See
# docker/apk-e2e/README.md for the runner-host emulator architecture.
apk-e2e:
  stage: apk-e2e
  needs:
    - job: build-apk
      artifacts: true
  tags:
    - android-kvm
  image: *apk_image
  variables:
    ANDROID_ADB_SERVER_ADDRESS: adb-host   # extra_hosts maps to host gateway
    ANDROID_ADB_SERVER_PORT: "5037"
    CDP_HOST: adb-host
    CDP_PORT: "9222"
    PKG: me.skishore.inkstone
    APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
    ARTIFACTS_DIR: artifacts
  before_script:
    - mkdir -p "$ARTIFACTS_DIR"
    - npm ci --ignore-scripts
    - adb devices
    - adb uninstall "$PKG" 2>&1 | tail -1 || true
    - adb install -r "$APK_PATH"
    - adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS 2>&1 || true
    - adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 > /dev/null
    - sleep 8
    - |
      WS=$(adb shell cat /proc/net/unix | awk '/webview_devtools_remote/{print $NF; exit}' | tr -d '\r')
      echo "WebView socket: $WS"
      adb forward tcp:9222 "localabstract:${WS#@}"
      curl -fs -H "Host: localhost" "http://$CDP_HOST:$CDP_PORT/json" > /dev/null && echo "CDP reachable via host"
      # Chrome DevTools rejects non-localhost Host headers. Bridge the
      # host-forwarded port to 127.0.0.1 inside the container so the test
      # can speak http+ws with Host: localhost.
      socat TCP-LISTEN:9222,bind=127.0.0.1,fork,reuseaddr TCP:"$CDP_HOST":"$CDP_PORT" &
      sleep 1
      curl -fs "http://localhost:9222/json" > /dev/null && echo "CDP reachable via local socat"
  script:
    - node scripts/test-apk-e2e.cjs
  artifacts:
    paths:
      - artifacts/
    when: always
    expire_in: 7 days
