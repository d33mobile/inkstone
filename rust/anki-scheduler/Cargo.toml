[package]
name = "anki-scheduler"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "Anki SM-2 scheduler compiled to WASM. Vendored from ankitects/anki."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
