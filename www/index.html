<script type="text/javascript">
window.WebAppLocalServer = window.WebAppLocalServer || new Proxy({}, {
  get: function(t, p) { return p in t ? t[p] : function(){}; }
});
var _kbShim = {close:function(){},show:function(){},hideKeyboardAccessoryBar:function(){},disableScroll:function(){}};
function _ensureCordova() {
  if (!window.cordova) window.cordova = {};
  if (!window.cordova.plugins) window.cordova.plugins = {};
  if (!window.cordova.plugins.Keyboard) window.cordova.plugins.Keyboard = _kbShim;
  if (!window.cordova.fireWindowEvent) window.cordova.fireWindowEvent = function(){};
}
_ensureCordova();
var _si = setInterval(_ensureCordova, 50);
setTimeout(function() { clearInterval(_si); }, 5000);
document.addEventListener("DOMContentLoaded", function() {
  _ensureCordova();
  document.dispatchEvent(new Event("deviceready"));
});
// On Android Capacitor, push content below system status bar
if (typeof window.Capacitor !== 'undefined') {
  document.addEventListener("DOMContentLoaded", function() {
    var s = document.createElement('style');
    s.textContent = '#header { height: calc(7vw + 36px) !important; padding-top: 36px !important; line-height: 7vw !important; }' +
      '#layout { top: calc(7vw + 36px) !important; }';
    document.head.appendChild(s);
  });
}
// Local notification on app start (hello world test)
if (typeof window.Capacitor !== 'undefined' && window.Capacitor.Plugins) {
  document.addEventListener("DOMContentLoaded", function() {
    var LN = window.Capacitor.Plugins.LocalNotifications;
    if (!LN) return;
    LN.requestPermissions().then(function() {
      LN.schedule({
        notifications: [{
          title: "Inkstone",
          body: "Hello world! Notifications are working.",
          id: 1,
          schedule: { at: new Date(Date.now() + 1000) },
        }]
      });
    }).catch(function(e) { console.error('Notification error:', e); });
  });
}
